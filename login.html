<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Saúde</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #3b0764 100%);
            color: #f8fafc;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Glowing background blobs */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: 0;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
        }
        body::before {
            background: #6366f1;
            top: -10%;
            left: -10%;
        }
        body::after {
            background: #db2777;
            bottom: -10%;
            right: -10%;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(to right, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        h2 {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .caixa {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: left;
        }

        .caixa h3 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
        }

        .caixa h3::after {
            content: "";
            display: block;
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, #6366f1, #db2777);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus, select:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        select option {
            background: #0f172a;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #db2777 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #be185d 100%);
        }

        button:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #a5b4fc;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #f472b6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login - Sistema de Saúde</h1>
        <h2>Acesso ao sistema do hospital</h2>
        <div class="caixa">
            <h3>Login Profissional</h3>
            <form id="formLogin">
                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" placeholder="Ex: 123456">
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <label for="cargo">Cargo</label>
                    <select id="cargo">
                        <option value="">Selecione seu cargo</option>
                        <option>Médico</option>
                        <option>Enfermeiro(a)</option>
                        <option>Farmacêutico(a)</option>
                        <option>Psicólogo(a)</option>
                    </select>
                </div>
                
                <button type="submit">Acessar Sistema</button>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <a href="index.html" class="back-link" style="margin-top: 0;">← Voltar ao Portfólio</a>
                    <a href="assets/documentos/tela de login.pdf" target="_blank" class="back-link" style="margin-top: 0; color: #ffd500;">📄 Relatório</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.getElementById("formLogin").addEventListener("submit", function (e) {
            e.preventDefault();
            let matricula = document.getElementById("matricula").value;
            let senha = document.getElementById("senha").value;
            let cargo = document.getElementById("cargo").value;
            if (matricula == "" || senha == "" || cargo == "") {
                alert("Preencha todos os campos!");
            } else {
                alert("BEM-VINDO AO SISTEMA!\n\nCargo: " + cargo +
                      "\nMatrícula: " + matricula +
                      "\nAcesso liberado com sucesso!");
            }
        });
    </script>
</body>
</html>
