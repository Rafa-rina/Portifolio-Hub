<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas, Tabelas e Formulários - Portfólio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            color: white;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.25), transparent 40%);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #3b82f6;
        }
        p {
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 1.05rem;
        }
        .back-link {
            display: inline-block;
            color: #93c5fd;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: #3b82f6;
            transform: translateX(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Listas, Tabelas e Formulários</h1>
        <p>
            Esta atividade foca no desenvolvimento estrutural utilizando elementos do HTML5 como listas ordenadas e não ordenadas, tabelas informativas e formulários de cadastro.
        </p>
        <a href="index.html" class="back-link">← Voltar ao Portfólio</a>
    </div>
</body>
</html>
